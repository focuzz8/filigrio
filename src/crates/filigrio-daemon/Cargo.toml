[package]
name = "filigrio-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "filigrio-daemon"
path = "src/bin/daemon.rs"

[dependencies]
parking_lot = "0.12"
filigrio-core = { workspace = true }
filigrio-pipeline = { workspace = true }
filigrio-resolve = { workspace = true }
filigrio-store = { workspace = true }
filigrio-ingest = { workspace = true }
filigrio-index = { workspace = true }
filigrio-query = { path = "../filigrio-query" }
filigrio-protocol = { path = "../filigrio-protocol" }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "7"
notify-debouncer-full = "0.4"
fs2 = { workspace = true }
libc = "0.2"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs"] }

[dev-dependencies]
tempfile = "3"