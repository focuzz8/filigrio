[package]
name = "filigrio-client-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "filigrio"
path = "src/main.rs"

[dependencies]
filigrio-protocol = { path = "../filigrio-protocol" }
filigrio-client-core = { path = "../filigrio-client-core" }
# The installation surface (ADR-0034). A library, engine-free, so `filigrio
# integration install` adds no link-time weight beyond templates and clap_complete.
filigrio-install = { path = "../filigrio-install" }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = { workspace = true }